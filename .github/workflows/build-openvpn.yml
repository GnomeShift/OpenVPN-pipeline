name: Build OpenVPN Docker image

on:
  workflow_dispatch:
    inputs:
      docker_image_name:
        description: 'Docker image name'
        required: true
        type: string
        default: 'openvpn-test'
      openvpn_version:
        description: 'Upstream OpenVPN version to build'
        required: true
        type: string
        default: 'latest'

permissions:
  contents: read

concurrency:
  group: openvpn-image-${{ inputs.docker_image_name }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: 'Resolve OpenVPN version'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      image: ${{ steps.validate.outputs.image }}
    steps:
      - name: 'Validate inputs and image name'
        id: validate
        env:
          IMAGE_NAME: ${{ inputs.docker_image_name }}
          DOCKERHUB_LOGIN: ${{ vars.DOCKERHUB_LOGIN }}
        run: |
          set -euo pipefail
          [[ -n "$DOCKERHUB_LOGIN" ]] || {
            echo '::error::DOCKERHUB_LOGIN repository variable is not set.' >&2
            exit 1
          }
          [[ "$DOCKERHUB_LOGIN" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || {
            echo "::error::DOCKERHUB_LOGIN '${DOCKERHUB_LOGIN}' is not a valid Docker Hub username." >&2
            exit 1
          }
          [[ "$IMAGE_NAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || {
            echo "::error::docker_image_name must be a single lowercase Docker Hub repository name." >&2
            exit 1
          }
          echo "image=${DOCKERHUB_LOGIN}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      # TODO: check regexes above
      - name: 'Resolve version'
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.openvpn_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API=https://api.github.com/repos/OpenVPN/openvpn

          if [ -z "$INPUT_VERSION" ] || [ "$INPUT_VERSION" = "latest" ]; then
            VERSION=$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "${API}/releases/latest" | jq -er '.tag_name | sub("^v";"")')
          else
            VERSION="${INPUT_VERSION#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::openvpn_version must be x.y.z or 'latest', got '${INPUT_VERSION}'." >&2
              exit 1
            }
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "${API}/releases/tags/v${VERSION}" | jq -er .tag_name >/dev/null || {
              echo "::error::No OpenVPN release for v${VERSION}." >&2
              exit 1
            }
          fi

          URL="https://swupdate.openvpn.net/community/releases/openvpn-${VERSION}.tar.gz"
          CODE=$(curl -so /dev/null -w '%{http_code}' "$URL")
          [ "$CODE" = "200" ] || {
            echo "::error::No release archive at ${URL} (${CODE})." >&2
            exit 1
          }
          SIG=$(curl -sLo /dev/null -w '%{http_code}' "${URL}.asc")
          [ "$SIG" = "200" ] || {
            echo "::error::No detached signature for openvpn-${VERSION} (${SIG})." >&2
            exit 1
          }

          echo "Resolved OpenVPN ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: 'Build and push OpenVPN'
    needs: resolve-version
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      OPENVPN_VERSION: ${{ needs.resolve-version.outputs.version }}
      IMAGE: ${{ needs.resolve-version.outputs.image }}
      CACHE_SCOPE: openvpn-${{ needs.resolve-version.outputs.version }}-${{ github.ref_name }}
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v7

      - name: 'Setup QEMU'
        uses: docker/setup-qemu-action@v4

      - name: 'Setup Docker Buildx'
        uses: docker/setup-buildx-action@v4

      - name: 'Build and test'
        run: |
          set -euo pipefail
          IMG="openvpn-ci-test:${GITHUB_RUN_ID}"

          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --build-arg "OPENVPN_VERSION=${OPENVPN_VERSION}" \
            --load \
            --tag "$IMG" \
            .

          docker run --rm "$IMG" openvpn --version \
            | head -n 1 | grep -F "OpenVPN ${OPENVPN_VERSION} "

          docker run --rm --entrypoint sh "$IMG" -eu -c '
            command -v ovpn_run >/dev/null || { echo "ovpn_run not on PATH" >&2; exit 1; }
            for f in /usr/local/bin/ovpn_*; do
              [ -x "$f" ] || { echo "$f is not executable" >&2; exit 1; }
              bash -n "$f" || { echo "$f has a syntax error" >&2; exit 1; }
            done
            echo "entrypoint resolves and all ovpn_* scripts parse"
          '

      - name: 'Login to Docker Hub'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 'Docker image meta'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.OPENVPN_VERSION }}
            type=raw,value=latest

      - name: 'Build and push OpenVPN image'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            OPENVPN_VERSION=${{ env.OPENVPN_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }},ignore-error=true
          provenance: mode=max
          sbom: true

      - name: 'Summary'
        if: '!cancelled()'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            if [ -z "$DIGEST" ]; then
              echo "## ❌ OpenVPN image build failed"
              echo
              echo "- **Requested version:** ${OPENVPN_VERSION}"
              echo "- **Image:** ${IMAGE}"
              echo "- **Cache scope:** \`${CACHE_SCOPE}\`"
            else
              echo "## ✅ OpenVPN image build complete"
              echo
              echo "- **OpenVPN version:** ${OPENVPN_VERSION}"
              echo "- **Image:** ${IMAGE}"
              echo "- **Digest:** \`${DIGEST}\`"
              echo "- **Cache scope:** \`${CACHE_SCOPE}\`"
              echo "- **Tags:**"
              printf '%s\n' "$TAGS" | sed 's/^/  - `/' | sed 's/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: 'Vulnerability scan'
    needs:
      - build-and-push
      - resolve-version
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 'Trivy scan'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ needs.resolve-version.outputs.image }}@${{ needs.build-and-push.outputs.digest }}
          format: 'json'
          output: 'trivy.json'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: 'Scan summary'
        if: always()
        continue-on-error: true
        run: |
          cat > .trivy-report.jq <<'JQEOF'
          def sev_badge:
            if   . == "CRITICAL" then "🔴 CRITICAL"
            elif . == "HIGH"     then "🟠 HIGH"
            elif . == "MEDIUM"   then "🟡 MEDIUM"
            elif . == "LOW"      then "🔵 LOW"
            else "⚪ " + . end;

          def cell: gsub("\\|"; "/") | gsub("\n"; " ");
          def sev_rank: if . == "CRITICAL" then 0 elif . == "HIGH" then 1 elif . == "MEDIUM" then 2 elif . == "LOW" then 3 else 4 end;

          [ .Results[]? as $r
            | ($r.Vulnerabilities // [])[]
            | . + { __class: ($r.Class // "unknown") }
          ] as $v
          | ($v | length) as $total
          | ($v | map(.Severity) | unique | sort_by(sev_rank)) as $seen
          | (
              if $total == 0 then
                "✅ No findings\n"
              else
                "**Total findings: \($total)**\n\n"
                + "| Severity | Found |\n|:--|--:|\n"
                + (reduce $seen[] as $s ("";
                    . + "| \($s | sev_badge) | \($v | map(select(.Severity == $s)) | length) |\n"))
                + "\n"
                + "| Severity | CVE | Package | Installed | Fixed in | Source |\n|:--|:--|:--|:--|:--|:--|\n"
                + ($v
                   | sort_by([ (.Severity | sev_rank), (.VulnerabilityID // ""), (.PkgName // "") ])
                   | .[:50]
                   | map("| \(.Severity | sev_badge) | \(.VulnerabilityID // "?" | cell) | \(.PkgName // "?" | cell) | \(.InstalledVersion // "?" | cell) | \(.FixedVersion // "-" | cell) | \(.__class | cell) |")
                   | join("\n"))
                + "\n"
                + (if $total > 50
                   then "\n_The first 50 of \($total) are shown. See more in scan logs_\n"
                   else "" end)
              end
            )
          JQEOF

          {
            echo "### 🛡️ Vulnerabilities"
            for pair in "trivy.json"; do
              f="${pair#*:}"
              echo ""
              if [ -s "$f" ] && jq -e . "$f" >/dev/null 2>&1; then
                jq -r -f .trivy-report.jq "$f" \
                  || echo "❌ jq failed to parse summary"
              else
                echo "❌ Scan failed"
              fi
              echo ""
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
