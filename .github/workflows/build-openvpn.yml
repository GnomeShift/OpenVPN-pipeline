name: Build OpenVPN Docker image

on:
  workflow_dispatch:
    inputs:
      docker_image_name:
        description: 'Docker image name'
        required: true
        default: 'openvpn'

jobs:
  build-and-push:
    name: 'Build and push OpenVPN'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v5

      - name: 'Setup QEMU'
        uses: docker/setup-qemu-action@v4

      - name: 'Setup Docker Buildx'
        uses: docker/setup-buildx-action@v4

      - name: 'Login to Docker Hub'
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 'Build inspector image and get latest OpenVPN version'
        id: get_version
        run: |
          INSPECTOR_IMAGE="openvpn-inspector:${{ github.run_id }}"
          docker build . -t "$INSPECTOR_IMAGE"

          OPENVPN_VERSION_STRING=$(docker run --rm "$INSPECTOR_IMAGE" openvpn --version | head -n 1)
          OPENVPN_VERSION=$(echo "$OPENVPN_VERSION_STRING" | awk '{print $2}')
          
          if [[ -z "$OPENVPN_VERSION" ]]; then
            echo "::error::Could not determine OpenVPN version."
            exit 1
          fi

          echo "Detected OpenVPN version: $OPENVPN_VERSION"
          echo "OPENVPN_VERSION=$OPENVPN_VERSION" >> $GITHUB_ENV

      - name: 'Set image name and tags'
        id: set_tags
        run: |
          IMAGE_NAME="${{ vars.DOCKERHUB_LOGIN }}/${{ github.event.inputs.docker_image_name }}"
          TAGS="${IMAGE_NAME}:${{ env.OPENVPN_VERSION }}"
          TAGS="$TAGS,${IMAGE_NAME}:latest"

          echo "Tags: $TAGS"
          echo "DOCKER_IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "DOCKER_TAGS=${TAGS}" >> $GITHUB_ENV

      - name: 'Build and push OpenVPN image'
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 'Summary'
        run: |
          echo "## ✅ OpenVPN image build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **OpenVPN version:** \`${{ env.OPENVPN_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.DOCKER_IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "  - \`${{ env.DOCKER_IMAGE_NAME }}:${{ env.OPENVPN_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "  - \`${{ env.DOCKER_IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
